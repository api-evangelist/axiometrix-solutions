description: Axiometrix Solutions is a global test and measurement company serving technology-intensive
  industries through three specialist brands - GRAS Sound & Vibration (acoustic and vibration sensors for
  challenging environments), imc Test & Measurement (modular data acquisition, signal conditioning, and
  shock/vibration solutions), and Audio Precision (audio and RF analyzers for quality validation). Its
  integrated portfolio of sensors, data acquisition systems, control software, analysis software, and test
  fixtures supports advanced research, R&D, and production/manufacturing test across aerospace, defense,
  automotive, consumer electronics, audiology and medical technology, communications, semiconductor, and
  environmental monitoring markets. Backed by Battery Ventures. No public web API or developer program has
  been identified for this provider.
